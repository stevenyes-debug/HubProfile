name: HubProfile
version: 1.0.0
main: dev.stephanoses.hubprofile.HubProfilePlugin
api-version: '1.21.11'
description: 大厅玩家头像与 Fabric 生存档案
commands:
  hubprofile:
    description: 打开自己的生存档案
    usage: /hubprofile [reload|check]
    aliases: [myprofile]
    permission: hubprofile.use
permissions:
  hubprofile.use:
    description: 查看自己的档案
    default: true
  hubprofile.admin:
    description: 重载配置和检查数据目录
    default: op
